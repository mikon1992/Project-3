<link rel="stylesheet" href="css/style.css">
<section class="pricing" aria-labelledby="pricing-title">
  <div class="container">
    <h2 id="pricing-title">Pilihan Paket Lokakarya</h2>  
    <div class="pricing-list">
      <article class="price-card">
        <h3>Mandiri</h3>
        <p class="price">Gratis</p>
        <ul>
          <li>Materi dasar</li>
          <li>Latihan mandiri</li>
        </ul>

        <a class="button" href="#daftar" aria-label="Pilih paket Mandiri">Pilih paket</a>
      </article>

      <article class="price-card price-card--featured">
        <p class="badge">Rekomendasi</p>
        <h3>Terbimbing</h3>
        <p class="price">
          <!-- Span mempermudah modifikasi desain di CSS nanti -->
          <span class="currency">Rp</span><span class="amount">150.000</span>
        </p>
        <ul>
          <li>Materi dasar</li>
          <li>Review tugas</li>
          <li>Code defense</li>
        </ul>
        <a class="button" href="#daftar" aria-label="Pilih paket Terbimbing">Pilih paket</a>
      </article>

      <article class="price-card">
        <h3>Intensif</h3>
        <p class="price">
          <span class="currency">Rp</span><span class="amount">250.000</span>
        </p>
        <ul>
          <li>Semua fasilitas</li>
          <li>Konsultasi tambahan</li>
        </ul>
        <a class="button" href="#daftar" aria-label="Pilih paket Intensif">Pilih paket</a>
      </article>
    </div>
  </div>
</section>
